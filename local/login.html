<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン|__PRODUCT__</title>
<link rel="stylesheet" href="/fonts/line-seed-jp/400.css">
<link rel="stylesheet" href="/fonts/line-seed-jp/800.css">
<style>
:root {
  --paper: #f4f7f5; --surface: #ffffff; --ink: #1c2923; --muted: #56675e; --rule: #cddbd3; --rule-strong: #9fbcae;
  --accent: #1d6a50; --accent-ink: #ffffff; --err: #b3261e; --err-soft: #fde7e9;
  --font: "LINE Seed JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #111815; --surface: #18211d; --ink: #e2ebe6; --muted: #9bada3; --rule: #2b3a33; --rule-strong: #3f574b;
    --accent: #62c39a; --accent-ink: #0d1a14; --err: #f28b82; --err-soft: #3b1d1b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 15px/1.8 var(--font); padding: 24px 16px; }
main { width: 100%; max-width: 380px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; font-feature-settings: "palt"; }
.brand::before { content: ""; width: 18px; height: 14px; border: 2px solid var(--accent); border-radius: 2px; background: linear-gradient(var(--accent), var(--accent)) 0 50% / 100% 2px no-repeat; }
.office { color: var(--muted); font-size: 13px; margin-top: -12px; }
form { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 22px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 18px; font-weight: 800; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { font: inherit; font-size: 15px; padding: 9px 11px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--surface); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 800; font-size: 15px; padding: 10px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { background: var(--err-soft); color: var(--err); border-radius: 4px; padding: 8px 12px; font-size: 13.5px; margin: 0; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand">__PRODUCT__</div>
  <div class="office">__OFFICE__</div>
  <form id="f" novalidate>
    <h1>ログイン</h1>
    <label for="id">ID<input id="id" name="id" autocomplete="username" required autofocus></label>
    <label for="pw">パスワード<input id="pw" name="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert" hidden></p>
    <button id="btn" type="submit">ログイン</button>
  </form>
  <p class="note">ID とパスワードが分からないときは、事務所の管理者にお問い合わせください。<br>この画面は事務所内のネットワークからだけ開けます。</p>
</main>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.hidden = true;
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: document.getElementById('id').value, password: document.getElementById('pw').value }) })
    .then(function (res) { return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'ログインできませんでした'); }); })
    .then(function () { location.href = '/'; })
    .catch(function (x) { err.textContent = x.message; err.hidden = false; document.getElementById('pw').value = ''; btn.disabled = false; });
});
</script>
</body>
</html>
